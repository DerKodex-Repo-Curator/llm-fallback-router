    <g transform="translate(196,78)"><rect width="160" height="72" rx="10" fill="#121622" stroke="#1f2737"/><text x="16" y="26" fill="#8b98ad" font-size="10" letter-spacing="1">REQUESTS</text><text x="16" y="54" fill="#e6edf3" font-size="24" font-weight="600">250</text></g>
    <g transform="translate(368,78)"><rect width="160" height="72" rx="10" fill="#121622" stroke="#1f2737"/><text x="16" y="26" fill="#8b98ad" font-size="10" letter-spacing="1">SUCCESS RATE</text><text x="16" y="54" fill="#3fb950" font-size="24" font-weight="600">99.2%</text></g>
    <g transform="translate(540,78)"><rect width="160" height="72" rx="10" fill="#121622" stroke="#1f2737"/><text x="16" y="26" fill="#8b98ad" font-size="10" letter-spacing="1">FAILOVERS</text><text x="16" y="54" fill="#e6edf3" font-size="24" font-weight="600">3</text></g>
    <g transform="translate(712,78)"><rect width="160" height="72" rx="10" fill="#121622" stroke="#1f2737"/><text x="16" y="26" fill="#8b98ad" font-size="10" letter-spacing="1">TOTAL COST</text><text x="16" y="54" fill="#e6edf3" font-size="24" font-weight="600">$1.84</text></g>
  </g>

