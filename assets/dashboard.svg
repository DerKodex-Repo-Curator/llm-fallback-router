<svg xmlns="http://www.w3.org/2000/svg" width="900" height="556" viewBox="0 0 900 556" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="llm-fallback-router live web dashboard">
  <rect x="1" y="1" width="898" height="554" rx="14" fill="#0b0e14" stroke="#1f2737"/>
  <!-- header -->
