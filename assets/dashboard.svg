    <line x1="40" y1="462" x2="860" y2="462" stroke="#1f2737"/>
    <text x="44" y="488" fill="#e6edf3" font-weight="600">mistral</text>
    <rect x="118" y="478" width="62" height="16" rx="4" fill="#3fb950" fill-opacity="0.15"/><text x="128" y="490" fill="#3fb950" font-size="11">mistral</text>
