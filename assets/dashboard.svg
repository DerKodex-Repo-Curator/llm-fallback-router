    <line x1="40" y1="502" x2="860" y2="502" stroke="#1f2737"/>
    <text x="44" y="526" fill="#e6edf3" font-weight="600">claude</text>
    <rect x="110" y="516" width="74" height="16" rx="4" fill="#8b98ad" fill-opacity="0.15"/><text x="120" y="528" fill="#8b98ad" font-size="11">gemini&#8202;skip</text>
